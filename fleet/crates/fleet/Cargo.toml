[package]
name = "fleet"
description = "Fleet hub: device registry, transports, placement and the fleet CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
fleet-proto.workspace = true
futures-util.workspace = true
# x509-parser: issuing a leaf reads the CA's subject and key identifier back from ca.pem.
rcgen = { workspace = true, features = ["x509-parser"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-rustls.workspace = true
# preserve_order: devices keep their file order, which is the registry order everywhere.
toml = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
x509-parser.workspace = true

[lints]
workspace = true
