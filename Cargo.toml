[workspace]
resolver = "3"
members = ["crates/fleet-proto", "crates/fleetd", "crates/fleet", "crates/harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
fleet-proto = { path = "crates/fleet-proto" }

anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
ipnet = "2.12.2"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustix = { version = "1.1.6", features = ["process", "fs"] }
# ring rather than aws-lc-rs: it needs no cmake, and TLS 1.2 stays compiled out.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# No "multithread": it pulls in rayon for a probe that runs every few seconds.
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk"] }
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["codec"] }
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
x509-parser = "0.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
