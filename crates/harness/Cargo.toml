[package]
name = "harness"
description = "The harness's own tools: the public-record lint, the queue count and the status dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bytes = "1"
clap.workspace = true
# The lint's patterns are Python's, look-around and backtracking included.
fancy-regex = "0.16.2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
getrandom = "0.2"
glob = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# A body the supervisor posts is parsed as GitHub would, so no link or HTML hides in it.
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.2"
rustix = { workspace = true, features = ["param", "system"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2.6"
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }

[lints]
workspace = true
