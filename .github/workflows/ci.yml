name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # tests/run.sh builds the harness binary, and tests/test_fleet_e2e.sh fleet and fleetd.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      # The runner image carries these; install only what a newer image dropped.
      - run: |
          declare -A pkg=([git]=git [flock]=util-linux [pgrep]=procps [bc]=bc [zstd]=zstd [jq]=jq [curl]=curl)
          missing=(); for cmd in "${!pkg[@]}"; do command -v "$cmd" >/dev/null || missing+=("${pkg[$cmd]}"); done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
      - run: tests/run.sh
